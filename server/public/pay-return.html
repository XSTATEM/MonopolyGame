<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Сюда ЮKassa возвращает игрока после оплаты из приложения (APK): браузер
     телефона открывает эту страницу, а само приложение проверяет платёж при
     возвращении в него (GET /api/shop/order/<id>). Скриптов нет намеренно. -->
<title>Оплата — Trade Monopoly</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EFE8DA">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="center-screen">
  <div class="join-box">
    <h1>Оплата</h1>
    <p>Спасибо! Если оплата прошла, покупка зачислится на ваш аккаунт в течение минуты.
      Вернитесь в приложение Trade Monopoly — оно само проверит платёж.</p>
    <p><a href="/">Открыть веб-версию</a></p>
  </div>
</main>
</body>
</html>
