# nginx перед игровым сервером «Биржи».
# install.sh подставляет __SERVER_NAME__ и __PORT__ и кладёт файл в
# /etc/nginx/sites-available/birzha. HTTPS (порт 443) дописывает certbot.
#
# Директивы map/limit_*_zone/upstream относятся к контексту http — файл
# подключается из sites-enabled внутри http {}, поэтому им здесь можно.
# Имена с префиксом birzha_, чтобы не конфликтовать с другими сайтами.

map $http_upgrade $birzha_connection_upgrade {
    default upgrade;
    ''      '';
}

# Подбор паролей: не больше 10 запросов к входу/профилю в минуту с одного IP.
limit_req_zone $binary_remote_addr zone=birzha_auth:10m rate=10r/m;
# Одновременные соединения (вкладки, WebSocket) с одного IP.
limit_conn_zone $binary_remote_addr zone=birzha_conn:10m;

upstream birzha_app {
    # 127.0.0.1, а не localhost: localhost может разрешиться в ::1, а Node слушает IPv4.
    server 127.0.0.1:__PORT__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    server_tokens off;
    # Фото профиля приходит base64 в JSON (сервер принимает до ~800 КБ).
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/birzha.access.log;
    error_log  /var/log/nginx/birzha.error.log warn;

    # Клиент читает ответы API как JSON — HTML-страница ошибки nginx его ломает.
    location @birzha_json429 {
        default_type "application/json; charset=utf-8";
        return 429 '{"error":"Слишком много попыток. Подождите минуту."}';
    }
    location @birzha_json502 {
        default_type "application/json; charset=utf-8";
        return 502 '{"error":"Сервер перезапускается — попробуйте через несколько секунд."}';
    }

    location ~ ^/api/(login|register|profile/|skins/) {
        limit_req zone=birzha_auth burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @birzha_json429;
        error_page 502 503 504 = @birzha_json502;

        proxy_pass http://birzha_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        error_page 502 503 504 = @birzha_json502;

        proxy_pass http://birzha_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_conn birzha_conn 40;

        proxy_pass http://birzha_app;
        proxy_http_version 1.1;
        # WebSocket живёт на корне сайта: вся онлайн-партия — одно долгое соединение.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $birzha_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Сервер пингует сокеты раз в 30 с; запас, чтобы nginx не рвал тихие партии.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
